spring:
  application:
    name: start
  datasource:
    url: jdbc:mysql://localhost:3306/dashboard_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: springuser
    password: springpass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  address: localhost
  port: 8080

notification:
  type: email
debug: false